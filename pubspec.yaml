name: agv_collector
description: AGV站台&人工地面货位采集APP，适配工业PDA，增加局域网Web下载
version: 1.0.0+15
environment:
  sdk: '>=3.4.0 <3.5.0'

dependencies:
  flutter:
    sdk: flutter
  isar: 3.1.0
  isar_flutter_libs: 3.1.0
  mobile_scanner: 3.5.1
  vibration: 1.8.4
  path_provider: 2.1.3
  shelf: 1.4.1
# (上传转码由浏览器完成，无需额外依赖)
  permission_handler: ^11.1.0
  http: ^1.2.1   # ==========新增这一行，用于MES接口http请求
  shared_preferences: ^2.2.3 # 新增，用来保存MES登录信息、token、MES服务器IP端口
  json_annotation: ^4.9.0
  pointycastle: 3.7.4
  xml: ^6.5.0
  asn1lib: ^1.6.4
  webview_flutter: 4.7.0 # AGV模块：哈工库讯实时调度大屏WebView
  flutter_local_notifications: 17.2.4 # ⑭系统通知：悬浮横幅/锁屏/息屏/自定义铃声
  flutter_tts: 4.0.2 # ⑭扫码语音播报：零件号后四位+件数
  audioplayers: 5.2.1 # ⑭数字拼播/⑯离线合成播放（6.x要求SDK35，Flutter3.22配5.2.1）
  archive: 3.6.1 # ⑯离线语音包zip解压
  sherpa_onnx: 1.12.14 # ⑯离线TTS引擎（piper中文，模型包局域网下载）

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: 3.1.0
  build_runner: 2.4.6
  json_serializable: ^6.8.0

flutter:
  # 【关键修复】声明使用 Material Design 图标字体。
  # 此前该节点为空，Flutter 不会把 MaterialIcons 图标字体打包进 APK，
  # 导致 PDA 上所有 Icons.xxx 渲染成"带叉方框"（豆腐块）。
  uses-material-design: true
  assets:
    - assets/voice/
