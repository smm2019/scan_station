<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓库管理控制台</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2430;--sub:#6b7a8d;--pri:#515bd4;--ok:#2e7d32;--warn:#e65100;--bad:#c62828;--line:#e3e8f0;--r:10px}
[data-theme=dark]{--bg:#101823;--card:#18222f;--ink:#e8eef5;--sub:#8fa1b3;--pri:#7c86e8;--line:#26313f}
*{box-sizing:border-box;margin:0}body{font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{cursor:pointer;border:0;border-radius:8px;font:inherit}input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hide{display:none!important}
.kkit{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center;color:var(--ink)}
.kkit:hover{background:var(--bg)}
.kkit b{font-family:Consolas,monospace}
.skl{background:linear-gradient(90deg,var(--bg) 25%,var(--line) 50%,var(--bg) 75%);background-size:200% 100%;animation:skl 1.2s infinite;border-radius:8px}
@keyframes skl{0%{background-position:200% 0}100%{background-position:-200% 0}}
#login{max-width:340px;margin:12vh auto;padding:28px}
#login input{width:100%;margin-bottom:10px}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:5}
header b{font-size:16px}header .sp{flex:1}
nav{display:flex;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{padding:7px 14px;background:transparent;color:var(--sub);white-space:nowrap}
nav button.on{background:var(--pri);color:#fff}
main{padding:14px;max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{padding:12px}.kpi .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.kpi .t{color:var(--sub);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;position:sticky;top:0;background:var(--card)}
.mono{font-family:Consolas,monospace}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.t-p{background:#fff3e0;color:#e65100}.t-a{background:#e3f2fd;color:#1565c0}.t-r{background:#e0f2f1;color:#00695c}.t-d{background:#e8f5e9;color:#2e7d32}.t-x{background:#eceff1;color:#78909c}
.pill{padding:5px 12px;background:var(--pri);color:#fff}.pill.g{background:var(--ok)}.pill.o{background:var(--warn)}.pill.r{background:var(--bad)}.pill.q{background:#8a97a8}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl-i{position:relative;padding:3px 0 9px}.tl-i::before{content:'';position:absolute;left:-20px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--line)}.tl-i.cur::before{background:var(--pri)}.tl-i.cur div:first-child{font-weight:700}
#drawer.dw-on{transform:translateX(0)!important}
@keyframes blinkbad{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.45)}50%{box-shadow:0 0 0 6px rgba(211,47,47,0)}}
.redpk{animation:blinkbad 1.4s ease-in-out infinite}
#nav button{position:relative}
.navbd{position:absolute;top:4px;right:6px;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;text-align:center}
@media(prefers-reduced-motion:reduce){.redpk{animation:none;border:2px solid var(--bad)}}
@keyframes fin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fin{animation:fin .3s ease both}
@media(prefers-reduced-motion:reduce){.fin{animation:none}}
.kdrag{opacity:.4;transform:scale(.98)}
.drop-on{outline:2px dashed var(--pri);outline-offset:3px;border-radius:12px;background:rgba(59,110,240,.07)}
.kcol{transition:background .15s,outline-color .15s}
a{color:var(--pri)}
#mask{position:fixed;inset:0;background:rgba(8,12,20,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.dlg{background:var(--card);border-radius:12px;padding:18px;width:min(440px,92vw);max-height:86vh;overflow:auto}
.dlg.wide{width:min(1020px,94vw)} /* ㉖ 表格类弹窗宽屏适配：电脑大屏放得开，不再挤成竖排+横向滚动条 */
.dlg h3{margin-bottom:10px}.dlg label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.dlg input,.dlg select{width:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26323e;color:#fff;padding:9px 18px;border-radius:8px;z-index:20;max-width:90vw}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:8px 8px 66px}header b{font-size:14px}
 #nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:8;border-bottom:0;border-top:1px solid var(--line);padding:6px 8px;box-shadow:0 -2px 12px rgba(0,0,0,.14);justify-content:flex-start}
 #nav button{flex:0 0 auto;padding:9px 14px;font-size:13px}
 .dlg{width:96vw!important;max-height:82vh}
 #drawer{width:100vw!important}
 .hscroll{grid-auto-flow:column!important;grid-auto-columns:minmax(80vw,1fr)!important;grid-template-columns:none!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;gap:10px!important}
 .hscroll>*{min-width:0}
}
</style></head><body>
<div id="login" class="card"><h2 style="margin-bottom:14px"> 仓库管理控制台</h2>
<input id="lu" placeholder="账号" autocomplete="username"><input id="lp" type="password" placeholder="密码" autocomplete="current-password">

<nav id="nav"></nav><main id="main"></main></div>
<div id="mask" class="hide"><div class="dlg" id="dlg"></div></div>

<script>
const $=s=>document.querySelector(s),T=(m,g)=>{const e=document.createElement('div');e.className='toast';if(g)e.style.background='var(--ok)';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)};

function go(t){TAB=t||TAB;if((location.hash||'').slice(1)!=TAB)location.hash='#'+TAB;$('#nav').innerHTML=TABS.filter(([k])=>(k!='admin'||U.role=='admin')&&(k!='inv'||U.role!='material')).map(([k,n])=>`<button class="${k==TAB?'on':''}" onclick="go('${k}')">${n}</button>`).join('');navBadge(window._lastRed||0);const _p=({dash:pgDash,reqs:pgReqs,ledger:pgLedger,parts:pgParts,flow:pgFlow,inv:pgInv,fix:pgFix,agv:pgAgv,rpt:pgRpt,exp:pgExp,dict:pgDict,admin:pgAdmin})[TAB]();if(_p&&_p.catch)_p.catch(()=>{try{$('#main').innerHTML='<div class="card" style="color:var(--warn)">加载失败（网络问题或服务未重启）　<button class="pill" onclick="go(\''+TAB+'\')">重试</button></div>'}catch(_){}})}

 const cell=(n,t,c,fn)=>`<div class="card kpi" ${fn?`style="cursor:pointer" onclick="${fn}"`:''}><div class="n" ${/^\d+$/.test(String(n))?`data-r="${n}"`:''} style="color:${c||'var(--ink)'}">${n}</div><div class="t">${t}</div></div>`;

 const _ord=(PF.kpi&&PF.kpi.length)?PF.kpi.filter((n)=>KARR.some((x)=>x[0]===n)):[];
 const kshow=_ord.length?_ord.map((n)=>KARR.find((x)=>x[0]===n)):KARR;
 const mx=Math.max(1,...tr.map(x=>Math.max(x.in,x.out)));
 $('#main').innerHTML=`<div class="row"><span style="color:var(--sub)">数据时刻 ${new Date(j.at).toLocaleTimeString('zh-CN')} · 30 秒自动刷新 · 点卡片可下钻 · <b style="color:var(--pri);cursor:pointer" onclick="kkOpen()">⌘K 快捷搜索</b></span><span class="sp"></span><button class="pill g" style="padding:3px 10px;font-size:12px" onclick="shiftDlg()">📋 交接日报</button></div>

function drawPlay(mins){const cv=$('#cvp');if(!cv||!PLAY)return;const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);bg(g,W,H);const cut=Date.now()-mins*60000;const pts=(PLAY.points||[]).filter(p=>p.ts>=cut);const L=NET.lands||{},all=[],b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};for(const k in L){const l=L[k];if(!FLOOR(l))continue;all.push(l);if(l.x<b.x0)b.x0=l.x;if(l.x>b.x1)b.x1=l.x;if(l.y<b.y0)b.y0=l.y;if(l.y>b.y1)b.y1=l.y;}for(const p of pts){if(p.x>=b.x0-1&&p.x<=b.x1+1&&p.y>=b.y0-1&&p.y<=b.y1+1)all.push(p);}const w2c=b.x0<b.x1?fit(all,W,H,24,b.x0,b.y0,b.x1,b.y1):fit(all,W,H,24);net(g,w2c);chargers(g,L,w2c);const byC={};for(const p of pts){(byC[p.id]=byC[p.id]||[]).push(p);}const cols=['#1e88e5','#43a047','#fb8c00','#8e24aa','#00897b','#e53935'];let i=0;for(const id in byC){const arr=byC[id].sort((a,b)=>a.ts-b.ts);const col=cols[i++%cols.length];g.strokeStyle=col;g.lineWidth=1.5;g.beginPath();arr.forEach((p,k)=>{const c=w2c(p.x,p.y);if(k)g.lineTo(c[0],c[1]);else g.moveTo(c[0],c[1]);});g.stroke();const e=w2c(arr[arr.length-1].x,arr[arr.length-1].y);g.fillStyle=col;g.beginPath();g.arc(e[0],e[1],4,0,7);g.fill();}}
