<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

#login .lbtn:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(81,91,212,.45)}

header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(90deg,var(--pri),var(--pri2,var(--pri)));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(30,40,90,.14)}
header b{font-size:16px}header .sp{flex:1}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
tbody tr:nth-child(even){background:rgba(120,140,170,.045)}tbody tr:hover{background:rgba(81,91,212,.07)}th{position:sticky;top:0;background:var(--card);z-index:1}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(120,140,170,.4);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:rgba(120,140,170,.6)}::-webkit-scrollbar-track{background:transparent}
nav button{border-radius:999px;transition:background .15s,color .15s}nav button.on{background:var(--pri);color:#fff}

.mono{font-family:Consolas,monospace}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.t-p{background:#fff3e0;color:#e65100}.t-a{background:#e3f2fd;color:#1565c0}.t-r{background:#e0f2f1;color:#00695c}.t-d{background:#e8f5e9;color:#2e7d32}.t-x{background:#eceff1;color:#78909c}
.pill{padding:5px 12px;background:var(--pri);color:#fff}.pill.g{background:var(--ok)}.pill.o{background:var(--warn)}.pill.r{background:var(--bad)}.pill.q{background:#8a97a8}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl-i{position:relative;padding:3px 0 9px}.tl-i::before{content:'';position:absolute;left:-20px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--line)}.tl-i.cur::before{background:var(--pri)}.tl-i.cur div:first-child{font-weight:700}
#drawer.dw-on{transform:translateX(0)!important}
#drawer.dw-full{width:100vw!important;border-left:none}
#drawer.dw-full #dw_b{padding:22px min(9vw,140px)}
@keyframes blinkbad{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.45)}50%{box-shadow:0 0 0 6px rgba(211,47,47,0)}}
.redpk{animation:blinkbad 1.4s ease-in-out infinite}
#nav button{position:relative}
.navbd{position:absolute;top:4px;right:6px;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;text-align:center}
@media(prefers-reduced-motion:reduce){.redpk{animation:none;border:2px solid var(--bad)}}

@media(prefers-reduced-motion:reduce){.fin{animation:none}}
.kdrag{opacity:.4;transform:scale(.98)}
.drop-on{outline:2px dashed var(--pri);outline-offset:3px;border-radius:12px;background:rgba(59,110,240,.07)}
.kcol{transition:background .15s,outline-color .15s}
a{color:var(--pri)}
#mask{position:fixed;inset:0;background:rgba(8,12,20,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.dlg{background:var(--card);border-radius:12px;padding:18px;width:min(440px,92vw);max-height:86vh;overflow:auto}
.dlg.wide{width:min(1020px,94vw)} /* ㉖ 表格类弹窗宽屏适配：电脑大屏放得开，不再挤成竖排+横向滚动条 */
.dlg h3{margin-bottom:10px}.dlg label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.dlg input,.dlg select{width:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26323e;color:#fff;padding:9px 18px;border-radius:8px;z-index:20;max-width:90vw}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:8px 8px 66px}header b{font-size:14px}
 header{flex-wrap:wrap;gap:6px;padding:8px 10px}header button{padding:4px 8px;font-size:12px}#who{display:none} /* ㉖ 驾驶舱窄屏：用户名隐藏防挤压换行 */
 .row{gap:6px}.pill{padding:4px 9px;font-size:12px}
 #nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:8;border-bottom:0;border-top:1px solid var(--line);padding:6px 8px;box-shadow:0 -2px 12px rgba(0,0,0,.14);justify-content:flex-start}
 #nav button{flex:0 0 auto;padding:9px 14px;font-size:13px}
 .dlg{width:96vw!important;max-height:82vh}
 #drawer{width:100vw!important}
 .hscroll{grid-auto-flow:column!important;grid-auto-columns:minmax(80vw,1fr)!important;grid-template-columns:none!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;gap:10px!important}
 .hscroll>*{min-width:0}
}
</style></head><body class="lgmode">
<div id="login"><div class="lgo">🏭</div><h2>仓库管理控制台</h2><div class="lsb">豪斯特仓储协同 · 登录后进入看板</div>

<nav id="nav"></nav><main id="main"></main></div>
<div id="mask" class="hide"><div class="dlg" id="dlg"></div></div>
<div id="kk" class="hide" style="position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:12;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh" onclick="if(event.target.id=='kk')this.classList.add('hide')"><div style="width:min(640px,94vw);background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)"><div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)"><span style="color:var(--sub)">🔍</span><input id="kki" placeholder="搜功能、页面或数据：单号 / 零件号 / 标签号 / 货位…（↑↓选择 Enter直达）" style="flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px" oninput="kkGo()"><kbd style="font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:1px 5px">Esc</kbd></div><div id="kkr" style="max-height:52vh;overflow:auto"></div></div></div>
<div id="dwmask" onclick="closeDrawer()" style="position:fixed;inset:0;background:rgba(8,12,20,.4);z-index:13;opacity:0;pointer-events:none;transition:.25s"></div>
<div id="drawer" style="position:fixed;top:0;right:0;height:100%;width:min(720px,96vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:14;transform:translateX(100%);transition:.28s ease;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)"><b id="dw_t" style="flex:1;font-size:17px"></b><button class="pill q" id="dw_fs" style="padding:3px 10px" title="全屏 / 还原" onclick="dwFull()">⛶</button><button class="pill q" style="padding:3px 10px" onclick="closeDrawer()">✕</button></div><div id="dw_b" style="flex:1;overflow:auto;padding:16px 22px;font-size:13.5px"></div></div>
<script>
const $=s=>document.querySelector(s),T=(m,g)=>{const e=document.createElement('div');e.className='toast';if(g)e.style.background='var(--ok)';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)};
let TK=localStorage.getItem('ck_tok')||'',U=JSON.parse(localStorage.getItem('ck_u')||'null'),TAB='dash',TM={},PF={},URS=30; // ㉖ URS=指挥舱页面自动刷新秒数（参数配置 uiRefreshSec，登录/心跳下发）
const RFT=()=>Math.max(1,Number(URS)||30)*1000, RFTXT=()=>Math.max(1,Number(URS)||30)+'秒自动刷新';
async function api(p,o={}){o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TK},o.headers||{});if(o.body&&typeof o.body!=='string')o.body=JSON.stringify(o.body);
 const r=await fetch(p,o);if(r.status==401||r.status==403){out();throw 0}
 if(r.status>=500){let m='HTTP '+r.status;try{const b=await r.clone().json();if(b&&b.msg)m=b.msg}catch(_){}throw new Error(m)} // ㉖ 仅服务器5xx抛出真因（4xx业务错误仍返回j供if(j.ok)处理，不破坏操作类调用点）
 return r.json()}
async function doLogin(){const u=$('#lu').value.trim(),p=$('#lp').value;$('#le').textContent='';
 try{if(!localStorage.getItem('ck_dev'))localStorage.setItem('ck_dev','WEB-'+Math.random().toString(36).slice(2,8).toUpperCase());const _lgo=async()=>{const rr=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,dev:localStorage.getItem('ck_dev'),kind:'web'})});return await rr.json();};let j;try{j=await _lgo();}catch(e0){await new Promise(s0=>setTimeout(s0,600));j=await _lgo();}
 if(!j.ok){$('#le').textContent=j.msg||'登录失败';return}TK=j.token;U=Object.assign({},j.user,{features:j.features||{}});PF=j.prefs||{};kkUseLoad();UiTune.serverPull();UiTune.apply();if(j.uiRefreshSec)URS=j.uiRefreshSec;if('theme' in PF)applyTheme(PF.theme);localStorage.setItem('ck_tok',TK);localStorage.setItem('ck_u',JSON.stringify(U));showApp();esSSE();go((location.hash||'').slice(1)||PF.landing||'')}catch(e){$('#le').textContent='网络错误：连不上服务（'+(e&&e.message?e.message:'连接被中断')+'），已自动重试仍失败——请稍后再试或确认服务已启动'}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function reqJump(s,extra){TM=Object.assign({s:s||'',q:'',mine:0,rush:0,late:0},extra||{});go('reqs')}
// ===== ㉖ 两端互移：网页侧 新建领料单 / 账本叫车 / 流水作废恢复 =====
window._nrowTpl=()=>'<div class="row nrow" style="gap:6px;margin:4px 0"><input class="npn mono" placeholder="零件号 *" style="flex:2;min-width:120px"><input class="nnm" placeholder="物料名" style="flex:2;min-width:110px"><input class="nqty" type="number" min="1" placeholder="数量 *" style="flex:1;min-width:64px"><label style="display:flex;align-items:center;gap:2px;font-size:12px" title="加急此行（配合行序：靠前=加急）"><input class="nrs" type="checkbox">🔥</label><button class="pill q" style="padding:3px 7px" title="上移" onclick="nrowMove(this,-1)">↑</button><button class="pill q" style="padding:3px 7px" title="下移" onclick="nrowMove(this,1)">↓</button><button class="pill q" style="padding:3px 9px" onclick="this.parentNode.remove()">删</button></div>';
function nrowMove(btn,dir){const r=btn.closest('.nrow'),sib=dir<0?r.previousElementSibling:r.nextElementSibling;if(!sib||!sib.classList.contains('nrow'))return;r.parentNode.insertBefore(dir<0?r:sib,dir<0?sib:r)}
async function newReqDlg(){let whs=[];try{whs=(await api('/api/requisitions/warehouse-users')).users||[]}catch(_){}
 const q=id=>String.fromCharCode(39)+id+String.fromCharCode(39);
 dlg('<h3>＋ 新建领料单</h3><div id="nitems">'+_nrowTpl()+_nrowTpl()+'</div><button class="pill q" style="margin:2px 0 8px" onclick="document.getElementById('+q('nitems')+').insertAdjacentHTML('+q('beforeend')+',window._nrowTpl())">＋ 加一行</button><label>备注</label><input id="nrm" placeholder="用途/线边工位等"><div class="row" style="gap:10px;margin:8px 0;flex-wrap:wrap"><label style="flex:1;min-width:160px">指定仓管员<select id="nasg"><option value="">不指定（全体仓管可接）</option>'+whs.map(w=>'<option value='+q(w.id)+'>'+w.name+'</option>').join('')+'</select></label><label style="width:150px">期望到货<input id="nnd" type="date"></label><label style="width:96px;margin-top:22px"><input id="nrush" type="checkbox"> 🔥整单急料</label><span style="font-size:11px;color:#888;align-self:center">行内🔥=单行加急；↑↓调序，靠前先出库</span></div><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="pill q" onclick="document.getElementById('+q('mask')+').classList.add('+q('hide')+')">取消</button><button class="pill g" onclick="newReqGo(this)">提交领料单</button></div>',1)}
async function newReqGo(btn){const items=[...document.querySelectorAll('.nrow')].map(r=>({partNo:r.querySelector('.npn').value.trim(),itemName:r.querySelector('.nnm').value.trim(),qty:Number(r.querySelector('.nqty').value),rush:r.querySelector('.nrs').checked})).filter(i=>i.partNo&&i.qty>0);
 if(!items.length){T('至少填一行零件号+数量');return}btn.disabled=true;
 try{const j=await api('/api/requisitions',{method:'POST',body:{items,remark:$('#nrm').value.trim(),assigneeId:$('#nasg').value,needDate:$('#nnd').value,rush:$('#nrush').checked}});
  if(j.ok){T('✅ 已提交 '+(j.req&&j.req.no||''),1);$('#mask').classList.add('hide');pgReqs()}else T('❌ '+(j.msg||'失败'))}catch(_){T('提交失败')}btn.disabled=false}

function uiTabMove(k, dir) {

  ord.splice(j, 0, ord.splice(i, 1)[0]);
  UIV.tabs = { order: ord, hidden: T.hidden || [] };
  UiTune.persist(); UiTune.pushT0(); UiTune.push(); UiTune.renderNav(); UiTune.repaintTabs();
}
function uiTabHide(k) {
