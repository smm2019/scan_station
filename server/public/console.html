<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓库管理控制台</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2430;--sub:#6b7a8d;--pri:#515bd4;--ok:#2e7d32;--warn:#e65100;--bad:#c62828;--line:#e3e8f0;--r:10px}
[data-theme=dark]{--bg:#101823;--card:#18222f;--ink:#e8eef5;--sub:#8fa1b3;--pri:#7c86e8;--line:#26313f}
*{box-sizing:border-box;margin:0}body{font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{cursor:pointer;border:0;border-radius:8px;font:inherit}input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hide{display:none!important}
.kkit{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center;color:var(--ink)}
.kkit:hover{background:var(--bg)}
.kkit b{font-family:Consolas,monospace}
.skl{background:linear-gradient(90deg,var(--bg) 25%,var(--line) 50%,var(--bg) 75%);background-size:200% 100%;animation:skl 1.2s infinite;border-radius:8px}
@keyframes skl{0%{background-position:200% 0}100%{background-position:-200% 0}}
#login{max-width:340px;margin:12vh auto;padding:28px}
#login input{width:100%;margin-bottom:10px}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:5}
header b{font-size:16px}header .sp{flex:1}
nav{display:flex;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{padding:7px 14px;background:transparent;color:var(--sub);white-space:nowrap}
nav button.on{background:var(--pri);color:#fff}
main{padding:14px;max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{padding:12px}.kpi .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.kpi .t{color:var(--sub);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;position:sticky;top:0;z-index:2;background:var(--card)}
.mono{font-family:Consolas,monospace}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.t-p{background:#fff3e0;color:#e65100}.t-a{background:#e3f2fd;color:#1565c0}.t-r{background:#e0f2f1;color:#00695c}.t-d{background:#e8f5e9;color:#2e7d32}.t-x{background:#eceff1;color:#78909c}
.pill{padding:5px 12px;background:var(--pri);color:#fff}.pill.g{background:var(--ok)}.pill.o{background:var(--warn)}.pill.r{background:var(--bad)}.pill.q{background:#8a97a8}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl-i{position:relative;padding:3px 0 9px}.tl-i::before{content:'';position:absolute;left:-20px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--line)}.tl-i.cur::before{background:var(--pri)}.tl-i.cur div:first-child{font-weight:700}
#drawer.dw-on{transform:translateX(0)!important}
#drawer.dw-full{width:100vw!important;border-left:none}
#drawer.dw-full #dw_b{padding:22px min(9vw,140px)}
@keyframes blinkbad{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.45)}50%{box-shadow:0 0 0 6px rgba(211,47,47,0)}}
.redpk{animation:blinkbad 1.4s ease-in-out infinite}
#nav button{position:relative}
.navbd{position:absolute;top:4px;right:6px;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;text-align:center}
@media(prefers-reduced-motion:reduce){.redpk{animation:none;border:2px solid var(--bad)}}
@keyframes fin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fin{animation:fin .3s ease both}
@media(prefers-reduced-motion:reduce){.fin{animation:none}}
.kdrag{opacity:.4;transform:scale(.98)}
.drop-on{outline:2px dashed var(--pri);outline-offset:3px;border-radius:12px;background:rgba(59,110,240,.07)}
.kcol{transition:background .15s,outline-color .15s}
a{color:var(--pri)}
#mask{position:fixed;inset:0;background:rgba(8,12,20,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.dlg{background:var(--card);border-radius:12px;padding:18px;width:min(440px,92vw);max-height:86vh;overflow:auto}
.dlg.wide{width:min(1020px,94vw)} /* ㉖ 表格类弹窗宽屏适配：电脑大屏放得开，不再挤成竖排+横向滚动条 */
.dlg h3{margin-bottom:10px}.dlg label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.dlg input,.dlg select{width:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26323e;color:#fff;padding:9px 18px;border-radius:8px;z-index:20;max-width:90vw}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:8px 8px 66px}header b{font-size:14px}
 header{flex-wrap:wrap;gap:6px;padding:8px 10px}header button{padding:4px 8px;font-size:12px}#who{display:none} /* ㉖ 驾驶舱窄屏：用户名隐藏防挤压换行 */
 .row{gap:6px}.pill{padding:4px 9px;font-size:12px}
 #nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:8;border-bottom:0;border-top:1px solid var(--line);padding:6px 8px;box-shadow:0 -2px 12px rgba(0,0,0,.14);justify-content:flex-start}
 #nav button{flex:0 0 auto;padding:9px 14px;font-size:13px}
 .dlg{width:96vw!important;max-height:82vh}
 #drawer{width:100vw!important}
 .hscroll{grid-auto-flow:column!important;grid-auto-columns:minmax(80vw,1fr)!important;grid-template-columns:none!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;gap:10px!important}
 .hscroll>*{min-width:0}
}
</style></head><body>
<div id="login" class="card"><h2 style="margin-bottom:14px"> 仓库管理控制台</h2>
<input id="lu" placeholder="账号" autocomplete="username"><input id="lp" type="password" placeholder="密码" autocomplete="current-password">
<button class="pill" style="width:100%;padding:10px" onclick="doLogin()">登 录</button>
<div id="le" style="color:var(--bad);font-size:12px;margin-top:8px"></div></div>
<div id="app" class="hide">
<header><b>🏭 仓库控制台</b><span class="sp"></span><span id="who" style="font-size:12px;opacity:.85"></span>
<button style="background:rgba(255,255,255,.18);color:#fff;padding:5px 10px;position:relative" title="消息中心" onclick="openMsgs()">🔔<span id="nbdg" class="hide" style="position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;text-align:center;padding:0 3px"></span></button>
<button style="background:rgba(255,255,255,.18);color:#fff;padding:5px 10px" onclick="location.reload()">⟳</button>
<button style="background:rgba(255,255,255,.18);color:#fff;padding:5px 10px" onclick="th()"><span id="thb">🌙</span></button>
<button style="background:rgba(255,255,255,.18);color:#fff;padding:5px 10px" onclick="prefDlg()">⚙ 偏好</button><button style="background:rgba(255,255,255,.18);color:#fff;padding:5px 10px" onclick="out()">退出</button></header>
<nav id="nav"></nav><main id="main"></main></div>
<div id="mask" class="hide"><div class="dlg" id="dlg"></div></div>
<div id="kk" class="hide" style="position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:12;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh" onclick="if(event.target.id=='kk')this.classList.add('hide')"><div style="width:min(560px,92vw);background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)"><div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)"><span style="color:var(--sub)">🔍</span><input id="kki" placeholder="搜领料单号 / 零件号 / 标签号 / 货位…（Ctrl+K 随时唤起）" style="flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px" oninput="kkGo()"><kbd style="font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:1px 5px">Esc</kbd></div><div id="kkr" style="max-height:52vh;overflow:auto"></div></div></div>
<div id="dwmask" onclick="closeDrawer()" style="position:fixed;inset:0;background:rgba(8,12,20,.4);z-index:13;opacity:0;pointer-events:none;transition:.25s"></div>
<div id="drawer" style="position:fixed;top:0;right:0;height:100%;width:min(720px,96vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:14;transform:translateX(100%);transition:.28s ease;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)"><b id="dw_t" style="flex:1;font-size:17px"></b><button class="pill q" id="dw_fs" style="padding:3px 10px" title="全屏 / 还原" onclick="dwFull()">⛶</button><button class="pill q" style="padding:3px 10px" onclick="closeDrawer()">✕</button></div><div id="dw_b" style="flex:1;overflow:auto;padding:16px 22px;font-size:13.5px"></div></div>
<script>
const $=s=>document.querySelector(s),T=(m,g)=>{const e=document.createElement('div');e.className='toast';if(g)e.style.background='var(--ok)';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)};
let TK=localStorage.getItem('ck_tok')||'',U=JSON.parse(localStorage.getItem('ck_u')||'null'),TAB='dash',TM={},PF={},URS=30; // ㉖ URS=指挥舱页面自动刷新秒数（参数配置 uiRefreshSec，登录/心跳下发）
const RFT=()=>Math.max(5,Number(URS)||30)*1000, RFTXT=()=>Math.max(5,Number(URS)||30)+'秒自动刷新';
async function api(p,o={}){o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TK},o.headers||{});if(o.body&&typeof o.body!=='string')o.body=JSON.stringify(o.body);
 const r=await fetch(p,o);if(r.status==401||r.status==403){out();throw 0}
 if(r.status>=500){let m='HTTP '+r.status;try{const b=await r.clone().json();if(b&&b.msg)m=b.msg}catch(_){}throw new Error(m)} // ㉖ 仅服务器5xx抛出真因（4xx业务错误仍返回j供if(j.ok)处理，不破坏操作类调用点）
 return r.json()}
async function doLogin(){const u=$('#lu').value.trim(),p=$('#lp').value;$('#le').textContent='';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const j=await r.json();
 if(!j.ok){$('#le').textContent=j.msg||'登录失败';return}TK=j.token;U=Object.assign({},j.user,{features:j.features||{}});PF=j.prefs||{};if(j.uiRefreshSec)URS=j.uiRefreshSec;if('theme' in PF)applyTheme(PF.theme);localStorage.setItem('ck_tok',TK);localStorage.setItem('ck_u',JSON.stringify(U));showApp();esSSE();go((location.hash||'').slice(1)||PF.landing||'')}catch(e){$('#le').textContent='网络错误'}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function reqJump(s,extra){TM=Object.assign({s:s||'',q:'',mine:0,rush:0,late:0},extra||{});go('reqs')}
// ===== ㉖ 两端互移：网页侧 新建领料单 / 账本叫车 / 流水作废恢复 =====
window._nrowTpl=()=>'<div class="row nrow" style="gap:6px;margin:4px 0"><input class="npn mono" placeholder="零件号 *" style="flex:2;min-width:120px"><input class="nnm" placeholder="物料名" style="flex:2;min-width:110px"><input class="nqty" type="number" min="1" placeholder="数量 *" style="flex:1;min-width:64px"><button class="pill q" style="padding:3px 9px" onclick="this.parentNode.remove()">删</button></div>';
async function newReqDlg(){let whs=[];try{whs=(await api('/api/requisitions/warehouse-users')).users||[]}catch(_){}
 const q=id=>String.fromCharCode(39)+id+String.fromCharCode(39);
 dlg('<h3>＋ 新建领料单</h3><div id="nitems">'+_nrowTpl()+_nrowTpl()+'</div><button class="pill q" style="margin:2px 0 8px" onclick="document.getElementById('+q('nitems')+').insertAdjacentHTML('+q('beforeend')+',window._nrowTpl())">＋ 加一行</button><label>备注</label><input id="nrm" placeholder="用途/线边工位等"><div class="row" style="gap:10px;margin:8px 0;flex-wrap:wrap"><label style="flex:1;min-width:160px">指定仓管员<select id="nasg"><option value="">不指定（全体仓管可接）</option>'+whs.map(w=>'<option value='+q(w.id)+'>'+w.name+'</option>').join('')+'</select></label><label style="width:150px">期望到货<input id="nnd" type="date"></label><label style="width:96px;margin-top:22px"><input id="nrush" type="checkbox"> 🔥急料</label></div><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="pill q" onclick="document.getElementById('+q('mask')+').classList.add('+q('hide')+')">取消</button><button class="pill g" onclick="newReqGo(this)">提交领料单</button></div>',1)}
async function newReqGo(btn){const items=[...document.querySelectorAll('.nrow')].map(r=>({partNo:r.querySelector('.npn').value.trim(),itemName:r.querySelector('.nnm').value.trim(),qty:Number(r.querySelector('.nqty').value)})).filter(i=>i.partNo&&i.qty>0);
 if(!items.length){T('至少填一行零件号+数量');return}btn.disabled=true;
 try{const j=await api('/api/requisitions',{method:'POST',body:{items,remark:$('#nrm').value.trim(),assigneeId:$('#nasg').value,needDate:$('#nnd').value,rush:$('#nrush').checked}});
  if(j.ok){T('✅ 已提交 '+(j.req&&j.req.no||''),1);$('#mask').classList.add('hide');pgReqs()}else T('❌ '+(j.msg||'失败'))}catch(_){T('提交失败')}btn.disabled=false}
async function webCancel(k,cx,code){if(!confirm(cx?('作废流水 '+code+'？将同步整框消账并允许重新扫码录入'):('恢复流水 '+code+'？将按原货位重登账本')))return;
 try{const j=await api('/api/scanlog/cancel',{method:'POST',body:{k,cx}});T(j.ok?('✅ '+(j.msg||'完成')):('❌ '+(j.msg||'失败')),2);if(j.ok)flowGo()}catch(_){T('操作失败')}} // ㉖⑫ 概览下钻统一入口：全量重置筛选(含搜索词/我的待办/急料/超时/视图)，杜绝"点进去空白"
function showApp(){try{probeSys();setInterval(probeSys,60000)}catch(_){}$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=`${U.name}（${U.role=='admin'?'管理员':U.role=='warehouse'?'仓管员':U.role=='inspector'?'检验员':'物料员'}）`;try{notifPoll();setInterval(notifPoll,45000)}catch(_){}}
function out(){localStorage.removeItem('ck_tok');localStorage.removeItem('ck_u');location.reload()}
function th(){const d=document.documentElement.dataset.theme=='dark'?'':'dark';document.documentElement.dataset.theme=d;localStorage.setItem('ck_th',d);$('#thb').textContent=d=='dark'?'☀️':'';PF.theme=d;if(TK)api('/api/prefs',{method:'POST',body:{theme:d}}).catch(()=>{})}
function applyTheme(t){document.documentElement.dataset.theme=t||'';localStorage.setItem('ck_th',t||'');const b=$('#thb');if(b)b.textContent=t=='dark'?'☀️':''}
const TABS=[['dash','📊 概览'],['reqs','📋 领料单'],['ledger','📦 货位账本'],['ctn','🗃 容器管理'],['parts','🧩 零件档案'],['flow','🌊 流水在线'],['inv','🧮 盘点'],['fix','🛠 修正与返架'],['insp','🔎 检验工单'],['agv','🤖 指挥舱'],['rpt','📈 工作量'],['exp','📤 导出中心'],['dict','🔤 字典'],['admin','⚙️ 控制后台']];
function go(t){TAB=t||TAB;if((location.hash||'').slice(1)!=TAB)location.hash='#'+TAB;$('#nav').innerHTML=TABS.filter(([k])=>(k!='admin'||U.role=='admin')&&(k!='inv'||U.role!='material')).map(([k,n])=>`<button class="${k==TAB?'on':''}" onclick="go('${k}')">${n}</button>`).join('');navBadge(window._lastRed||0);const _p=({dash:pgDash,reqs:pgReqs,ledger:pgLedger,ctn:pgCtn,parts:pgParts,flow:pgFlow,inv:pgInv,fix:pgFix,insp:pgInsp,agv:pgAgv,rpt:pgRpt,exp:pgExp,dict:pgDict,admin:pgAdmin})[TAB]();if(_p&&_p.catch)_p.catch((e)=>{try{$('#main').innerHTML='<div class="card" style="color:var(--warn)">加载失败：'+(e&&e.message?_esc(String(e.message)):'网络问题或服务未重启')+'　<button class="pill" onclick="go(\''+TAB+'\')">重试</button></div>'}catch(_){}})}
function navBadge(n){const b=document.querySelector('#nav button');if(!b)return;let bd=b.querySelector('.navbd');if(n>0){if(!bd){bd=document.createElement('span');bd.className='navbd';b.appendChild(bd)}bd.textContent=n>9?'9+':n}else if(bd)bd.remove()}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(U&&h&&h!=TAB)go(h)});
const ST={'pending':['待接单','t-p'],'accepted':['已接单','t-a'],'ready':['待签收','t-r'],'done':['已签收','t-d'],'rejected':['已拒单','t-x'],'cancelled':['已取消','t-x']};
async function pgDash(){$('#main').innerHTML='<div class="card skl" style="height:16px;margin-bottom:10px"></div><div class="grid">'+'<div class="card kpi" style="height:66px"><div class="skl" style="height:24px;width:42%;margin-bottom:8px"></div><div class="skl" style="height:11px;width:64%"></div></div>'.repeat(8)+'</div>';
 const j=await api('/api/dashboard');const k=j.kpi||{},tr=j.trend||[];
 let ex='';try{const[ev,al,rq]=await Promise.all([api('/api/agv/events').catch(()=>({})),api('/api/agv/alarms').catch(()=>({})),api('/api/requisitions').catch(()=>({}))]);
  const evs=ev.list||[],als=(al.list||[]).filter(a=>!a.ackBy);
  const jam=evs.filter(e=>e.kind=='堵点').length,low=evs.filter(e=>e.kind=='出库超时'||e.kind=='入库超时').length; // ㉖ 入库超时独立成类后一并计入
  const reqs=rq.reqs||[];
  const rush=reqs.filter(r=>r.rush&&r.status=='pending').length;
  const late=reqs.filter(r=>r.status=='ready'&&(Date.now()-(Number(r.readyAt)||Date.parse(((r.history||[]).slice(-1)[0]||{}).time||r.createdAt||0)))>30*60000).length; // ㉖⑫ 优先用精确备齐时刻，老数据回退历史尾条
  const _now=Date.now(),_dis=(kk,n)=>DIS[kk]&&DIS[kk].n>=n&&_now-DIS[kk].at<10*60000;
  const reds=als.filter((a)=>a.red).length;window._lastRed=reds;navBadge(reds);
  const items=[[reds,'红牌急停(30分未处理)',"EVK='';go('agv');agvTab('ev');EVUN=1",'redflag'],[als.length-reds,'未认领告警',"EVK='';go('agv');agvTab('ev');EVUN=1",'alarms'],[jam,'路网点堵',"EVK='堵点';EVW='d';go('agv');agvTab('ev')",'jam'],[low,'搬运超时',"EVK='超时';EVW='d';go('agv');agvTab('ev')",'overtime'],[rush,'急料待接',"reqJump('pending',{rush:1})",'rush'],[late,'待签收超30分',"reqJump('ready',{late:1})",'late'],[(k.inspWait||0),'检验待处理(协助/退货)',"go('insp')",'inspwait']];

function ctSlotStats(){

 const rows={};let miscN=0,miscB=0;
 Object.entries(CTN.byBox).forEach(([loc,boxes])=>{
  const p=String(loc).split('-');
  if(p.length<4){miscN++;miscB+=boxes.length;return}
  const tier=p.slice(3).join('-'),rack=/\dF$/.test(tier);
  const rowid=rack?p[0]+'-'+p[1]:p.slice(0,3).join('-');

  const col=rack?(Number(p[2])||0):(Number(tier)||0);

  R.cells[col]={loc:String(boxes[0]&&boxes[0].l).toUpperCase(),boxes};
  if(col>R.max)R.max=col;
 });
 const zoneSt={};let total=0,used=0;
 Object.keys(rows).forEach(k=>{const R=rows[k];
  R.hi=R.rack?R.max:Math.max(R.max,Number(CTN.gslots[R.rowid])||12);
  const n=R.hi,o=Object.keys(R.cells).length;total+=n;used+=o;

 return {rows,zoneSt,total,used,miscN,miscB};
}

 try{const j=await api('/api/rcs/taskAct',{method:'POST',body:{op,dispatchNo:no}});T(j.ok?('✅ '+L+' 已执行'):('❌ '+(j.msg||'失败')));loadQ()}catch(_){T(L+'请求失败')}}
