name: Build‑Scan‑Station‑APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.22.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: false # 改这里！关闭flutter-action自带缓存

      - name: Install Android Command‑Line Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip -d latest
          rm commandlinetools-linux-12266719_latest.zip
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install minimal Android SDK packages
        env:
          SKIP_JDK_VERSION_CHECK: true
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Restore signing keystore
        shell: pwsh
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:KS_B64)) { Write-Host '未配置签名Secret，回退debug签名'; exit 0 }
          [IO.File]::WriteAllBytes("$PWD/android/keystore.jks", [Convert]::FromBase64String($env:KS_B64))
          Set-Content -Path "android/key.properties" -Value @("storeFile=keystore.jks", "storePassword=$env:KS_PW", "keyAlias=scan_station", "keyPassword=$env:KS_PW")
          Write-Host "keystore还原完成: $(Test-Path 'android/keystore.jks') / key.properties: $(Test-Path 'android/key.properties')"

      - name: Sync AppUpdater version constants from pubspec
        shell: pwsh
        run: |
          $m = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)' | Select-Object -First 1
          if (-not $m) { Write-Host '::error::pubspec version parse failed'; exit 1 }
          $ver = $m.Matches[0].Groups[1].Value
          $bld = $m.Matches[0].Groups[2].Value
          $f = 'lib/update_page.dart'
          $c = Get-Content -Raw -Encoding UTF8 $f
          $c2 = $c -replace 'static const localVersion = "[^"]*"', ('static const localVersion = "' + $ver + '"')
          $c2 = $c2 -replace 'static const localBuild = \d+', ('static const localBuild = ' + $bld)
          if ($c2 -notmatch ('static const localBuild = ' + $bld + '\b')) { Write-Host '::error::localBuild sync verify failed'; exit 1 }
          if ($c2 -ne $c) { [IO.File]::WriteAllText((Join-Path (Get-Location) $f), $c2, (New-Object System.Text.UTF8Encoding($false))); Write-Host "AppUpdater constants were stale, synced to $ver+$bld" } else { Write-Host "AppUpdater already in sync: $ver+$bld" }

      - name: flutter pub get
        run: flutter pub get

      - name: Generate Isar Database Code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Static analysis gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: disable analytics
        run: flutter config --no-analytics

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: scan‑station‑apk‑output
          path: build/app/outputs/apk/release/app-release.apk
