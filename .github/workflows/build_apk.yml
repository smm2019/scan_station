name: Build‑Scan‑Station‑APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.22.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Android Command‑Line Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip -d latest
          rm commandlinetools-linux-12266719_latest.zip
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install minimal Android SDK packages
        env:
          SKIP_JDK_VERSION_CHECK: true
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: flutter pub get
        run: flutter pub get

      - name: Generate Isar Database Code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: disable analytics
        run: flutter config --no-analytics

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: scan‑station‑apk‑output
          path: build/app/outputs/apk/release/app-release.apk
